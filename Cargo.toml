[package]
name = "software_supply_chain_exporter"
version = "0.3.1"
authors = ["Samantha Yilmaz", "Jan Christian Grünhage", "Sebastian Fleer"]
edition = "2024"
description = "SBOM and vulnerability metrics for node_exporter textfile collection"
repository = "https://github.com/famedly/software_supply_chain_exporter"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
bollard = { version = "0.20" }
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
humantime = "2.3.0"
humantime-serde = "1.1.1"
itertools = "0.14.0"
prometheus-client = { version = "0.24.1" }
rust_decimal = { version = "1.41", features = ["serde-with-float"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
serde_yaml = "0.9.34"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "process", "macros", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"
